[project]
name = "arcos-transparente"
version = "0.1.0"
description = "Observatório Arcos - Sistema de transparência de dados públicos"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "loguru>=0.7.0",
    "dotenv>=0.9.9",
    "pydantic>=2.0.0",
    "langchain>=1.3.1",
    "langchain-chroma>=0.2.6",
    "langchain-openai>=1.2.2",
    "langchain-core>=1.4.0",
    "langchain-text-splitters>=0.3.11",
    "langsmith>=0.8.5",
    "langgraph>=1.2.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.42.1",
    "streamlit>=1.41.0",
    "beautifulsoup4>=4.14.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.15.14",
]
